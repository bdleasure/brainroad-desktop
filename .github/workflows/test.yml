name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      # The phone link uses the versions Hermes itself ships; aiohttp only runs the fake service.
      - run: python -m pip install websockets==15.0.1 httpx==0.28.1 aiohttp==3.14.5
      - run: python -m unittest discover -s tests -v
      - name: Reproducible source download
        run: |
          python build.py --output first
          python build.py --output second
          cmp first/brainroad-desktop.json second/brainroad-desktop.json
          cat first/brainroad-desktop.json
